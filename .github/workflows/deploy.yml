name: Deploy Next.js site to GitHub Pages

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-custom
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..60}; do
            BUILD_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            COMMIT="$(printf '%s' "$BUILD_JSON" | jq -r '.commit // ""')"
            STATUS="$(printf '%s' "$BUILD_JSON" | jq -r '.status // ""')"

            echo "Pages build: commit=$COMMIT status=$STATUS"

            if [[ "$COMMIT" == "$EXPECTED_SHA" && "$STATUS" == "built" ]]; then
              echo "Legacy Pages build finished."
              exit 0
            fi

            if [[ "$COMMIT" == "$EXPECTED_SHA" && "$STATUS" == "errored" ]]; then
              echo "Legacy Pages build errored; continuing with the Next.js artifact deployment."
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for the legacy Pages build for $EXPECTED_SHA."
          exit 1

      - name: Build
        run: npm install && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
